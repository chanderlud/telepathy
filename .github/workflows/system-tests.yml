name: System Tests

on:
  workflow_call:
    inputs:
      sweep_indices:
        description: "JSON array of seeded system-test sweep indices"
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  system_tests:
    runs-on: ubuntu-latest
    name: System Tests [sweep ${{ matrix.sweep_index }}, seed ${{ github.run_id }}-${{ matrix.sweep_index }}]
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        sweep_index: ${{ fromJSON(inputs.sweep_indices) }}

    env:
      SYSTEM_TEST_ORDER_SEED: ${{ format('{0}-{1}', github.run_id, matrix.sweep_index) }}

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev iproute2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          cache: true
          cache-workspaces: rust

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: system-tests/requirements.txt

      - name: Install system test dependencies
        run: python -m pip install -r system-tests/requirements.txt

      - name: Build CLI binary
        run: bash system-tests/build.sh

      - name: Generate relay TLS certificates
        run: bash system-tests/relay/gen-certs.sh

      - name: Start iroh discovery containers
        run: docker compose -f system-tests/docker-compose.yml up -d --wait

      - name: Run system tests
        env:
          # debug-level core logs land in each CLI's stderr, which failure
          # artifacts capture verbatim; collision/negotiation races are
          # otherwise invisible in info-level logs
          RUST_LOG: telepathy_cli=info,telepathy_core=debug,iroh=info
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo -E "$PYTHON_BIN" -m pytest -p no:terminal system-tests/tests --artifacts-dir system-tests/artifacts --save-artifacts failures

      - name: Stop iroh discovery containers
        if: always()
        run: docker compose -f system-tests/docker-compose.yml down

      - name: Upload system-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-tests-artifacts-sweep-${{ matrix.sweep_index }}-seed-${{ env.SYSTEM_TEST_ORDER_SEED }}
          path: system-tests/artifacts
          if-no-files-found: ignore
