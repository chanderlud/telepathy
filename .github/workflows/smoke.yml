name: Smoke

# Proves the built app launches on every platform without crashing at
# startup. Exists because months of Android breakage (missing native
# library, bad JNI version, desktop-only plugins, read-only log path)
# shipped untested; see docs/solutions/runtime-errors/android-native-build-and-startup-chain-2026-08-03.md

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STARTUP_SECONDS: 30

jobs:
  android:
    runs-on: ubuntu-latest
    name: Launch on Android emulator
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: telepathy_windows-2022_apk
          path: build/app/outputs/flutter-apk

      - name: Launch app and assert clean startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            set -eux
            adb install -r build/app/outputs/flutter-apk/telepathy.apk
            adb logcat -c
            adb shell monkey -p com.cflmstudios.telepathy -c android.intent.category.LAUNCHER 1
            sleep $STARTUP_SECONDS
            adb shell pidof com.cflmstudios.telepathy
            adb logcat -d > logcat.txt
            ! grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|PanicException|MissingPluginException' logcat.txt

  ios:
    runs-on: macos-15
    name: Launch on iOS simulator
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          cache: true
          cache-workspaces: rust

      - name: Install Apple Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Cache Flutter pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Packages
        run: flutter pub get

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Launch app and assert clean startup
        run: |
          set -eux
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS' and r['isAvailable']]; print(rs[-1]['identifier'])")
          DEVICE=$(xcrun simctl create ci-smoke com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME" || xcrun simctl create ci-smoke com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" com.cflm-studios.telepathy
          sleep $STARTUP_SECONDS
          xcrun simctl spawn "$DEVICE" launchctl list | grep telepathy

  macos:
    runs-on: macos-14
    name: Launch on macOS
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: telepathy_macos-14_macos
          path: telepathy-macos.app

      - name: Launch app and assert clean startup
        run: |
          set -eux
          APP=telepathy-macos.app
          BINARY="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Contents/Info.plist")"
          chmod +x "$BINARY"
          "$BINARY" > app.log 2>&1 &
          APP_PID=$!
          sleep $STARTUP_SECONDS
          kill -0 $APP_PID
          ! grep -E 'Unhandled Exception|PanicException|MissingPluginException|Segmentation fault' app.log
          kill $APP_PID || true

  linux:
    runs-on: ubuntu-24.04
    name: Launch on Linux
    steps:
      - name: Linux Runtime Prerequisites
        run: sudo apt-get update && sudo apt-get install libgtk-3-0 libasound2 libsecret-1-0 xvfb dbus-x11 gnome-keyring

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: telepathy_ubuntu-24.04_linux
          path: build/linux/x64/debug/bundle

      - name: Launch app and assert clean startup
        run: |
          set -eux
          cat > /tmp/smoke.sh <<'EOF'
          #!/bin/bash
          set -ux
          echo "" | gnome-keyring-daemon --unlock > /dev/null 2>&1 || true
          chmod +x ./build/linux/x64/debug/bundle/telepathy/telepathy
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/linux/x64/debug/bundle/telepathy/telepathy > app.log 2>&1 &
          APP_PID=$!
          sleep $STARTUP_SECONDS
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "app exited before $STARTUP_SECONDS seconds"
            cat app.log
            exit 1
          fi
          if grep -E 'Unhandled Exception|PanicException|MissingPluginException|Segmentation fault' app.log; then
            exit 1
          fi
          pkill -f 'bundle/telepathy/telepathy' || true
          EOF
          chmod +x /tmp/smoke.sh
          dbus-run-session -- /tmp/smoke.sh

  windows:
    runs-on: windows-2022
    name: Launch on Windows
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: telepathy_windows-2022_windows
          path: build/windows/x64/runner/Debug

      - name: Launch app and assert clean startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build\windows\x64\runner\Debug\telepathy\telepathy.exe"
          if (!(Test-Path $exe)) { throw "binary not found: $exe" }
          $p = Start-Process -FilePath $exe -RedirectStandardOutput app.log -RedirectStandardError app-err.log -PassThru
          Start-Sleep -Seconds $env:STARTUP_SECONDS
          $p.Refresh()
          if ($p.HasExited) {
            Write-Host "app exited early with code $($p.ExitCode)"
            Get-Content app.log, app-err.log -ErrorAction SilentlyContinue
            exit 1
          }
          $bad = Select-String -Path app.log, app-err.log -Pattern 'Unhandled Exception|PanicException|MissingPluginException' -ErrorAction SilentlyContinue
          if ($bad) { $bad; exit 1 }
          Stop-Process -Id $p.Id -Force

  web:
    runs-on: ubuntu-24.04
    name: Launch on Web (headless Chrome)
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v8
        with:
          name: telepathy_ubuntu-24.04_web
          path: build/web

      - name: Launch app and assert clean startup
        run: |
          set -eux
          python3 -m http.server 8080 --directory build/web/telepathy > /dev/null 2>&1 &
          SERVER_PID=$!
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --enable-logging=stderr --v=0 --virtual-time-budget=20000 \
            --dump-dom http://localhost:8080 > dom.html 2> console.log || true
          kill $SERVER_PID || true
          grep -qE 'flt-scene-host|flutter-view|flt-glass-pane' dom.html
          ! grep -E 'Uncaught|MissingPluginException|Panicked' console.log
