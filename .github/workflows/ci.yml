name: CI

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint_rust:
    runs-on: ubuntu-latest
    name: Lint Rust

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          components: rustfmt, clippy
          cache: true
          cache-workspaces: rust

      - name: Check formatting
        run: cd rust && cargo fmt -- --check

      - name: Lint with Clippy
        run: cd rust && cargo clippy -- -D warnings

  lint_flutter:
    runs-on: ubuntu-latest
    name: Lint Flutter

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.7

      - name: Get Packages
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Lint with flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

  test_flutter:
    needs: lint_flutter
    runs-on: ubuntu-latest
    name: Test Flutter
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.7

      - name: Get Packages
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test test

  test_rust:
    needs: lint_rust
    runs-on: ubuntu-latest
    name: Test Rust
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          cache: true
          cache-workspaces: rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none

      - name: Run Rust tests
        run: |
          cd rust
          cargo nextest run --all-targets -E 'not kind(=bench) and not binary(=core_integration_test)'
          cargo nextest run -p telepathy_core --test core_integration_test --features integration-testing --stress-count 10

  build_rust:
    needs: [lint_rust, test_rust]
    runs-on: ${{ matrix.info.image }}
    name: Build Rust [${{ matrix.info.image }} ${{ matrix.info.target }}]

    strategy:
      fail-fast: true

      matrix:
        info:
          - image: windows-2022
            target: x86_64-pc-windows-msvc
          - image: macos-14
            target: aarch64-apple-darwin
          - image: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - image: ubuntu-latest
            target: aarch64-linux-android
          - image: macos-15
            target: aarch64-apple-ios

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Setup Android SDK
        if: matrix.info.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v4

      - uses: nttld/setup-ndk@v1
        if: matrix.info.target == 'aarch64-linux-android'
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Set up NDK
        if: matrix.info.target == 'aarch64-linux-android'
        run: |
          export TARGET_TRIPLE="aarch64-linux-android"
          export TARGET_API="26"
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TARGET_API/$TARGET_TRIPLE" >> $GITHUB_PATH

      - name: Configure Rust for Android
        if: matrix.info.target == 'aarch64-linux-android'
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/" >> $GITHUB_ENV

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          target: ${{ matrix.info.target }}
          cache: true
          cache-workspaces: rust

      - name: Configure Apple Rust build environment
        if: startsWith(matrix.info.target, 'aarch64-apple-')
        run: |
          if [[ "${{ matrix.info.target }}" == "aarch64-apple-darwin" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.info.target }}" == "aarch64-apple-ios" ]]; then
            IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
            IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
            IOS_AR="$(xcrun --sdk iphoneos --find ar)"

            echo "SDKROOT=$IOS_SDK" >> "$GITHUB_ENV"
            echo "IPHONEOS_DEPLOYMENT_TARGET=18.0" >> "$GITHUB_ENV"
            echo "CC_aarch64_apple_ios=$IOS_CLANG" >> "$GITHUB_ENV"
            echo "AR_aarch64_apple_ios=$IOS_AR" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$IOS_CLANG" >> "$GITHUB_ENV"
            echo "CFLAGS_aarch64_apple_ios=-target arm64-apple-ios -isysroot $IOS_SDK -miphoneos-version-min=18.0" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cd rust && cargo build --verbose --target ${{ matrix.info.target }}

  system_tests:
    needs: lint_rust
    runs-on: ubuntu-latest
    name: System Tests

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev iproute2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          cache: true
          cache-workspaces: rust

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: system-tests/requirements.txt

      - name: Install system test dependencies
        run: python -m pip install -r system-tests/requirements.txt

      - name: Build CLI binary
        run: bash system-tests/build.sh

      - name: Generate relay TLS certificates
        run: bash system-tests/relay/gen-certs.sh

      - name: Start iroh discovery containers
        run: docker compose -f system-tests/docker-compose.yml up -d --wait

      - name: Run system tests
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo -E "$PYTHON_BIN" -m pytest -p no:terminal system-tests/tests --artifacts-dir system-tests/artifacts --save-artifacts failures

      - name: Stop iroh discovery containers
        if: always()
        run: docker compose -f system-tests/docker-compose.yml down

      - name: Upload system-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-tests-artifacts
          path: system-tests/artifacts
          if-no-files-found: ignore

  build_flutter:
    needs: [lint_rust, lint_flutter]
    uses: ./.github/workflows/build-flutter.yml
    with:
      skip-cache: false
