name: CI

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint_rust:
    runs-on: ubuntu-latest
    name: Lint Rust

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          components: rustfmt, clippy
          cache: true
          cache-workspaces: rust

      - name: Check formatting
        run: cd rust && cargo fmt -- --check

      - name: Lint with Clippy
        run: cd rust && cargo clippy -- -D warnings

  lint_flutter:
    runs-on: ubuntu-latest
    name: Lint Flutter

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.7

      - name: Get Packages
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Lint with flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

  check_frb_bindings:
    runs-on: ubuntu-latest
    name: Check FRB Bindings
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.7

      - name: Get Packages
        run: flutter pub get

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          components: rustfmt
          cache: true
          cache-workspaces: rust

      - name: Resolve flutter_rust_bridge version
        id: frb
        run: |
          VERSION=$(awk '/^  flutter_rust_bridge:$/{found=1} found && /version:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache FRB codegen binary
        id: codegen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ runner.os }}-${{ steps.frb.outputs.version }}

      - name: Install flutter_rust_bridge_codegen (prebuilt binary)
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        env:
          FRB_VERSION: ${{ steps.frb.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v${FRB_VERSION}"
          BASE_URL="https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v${FRB_VERSION}"
          curl -sSfLO "${BASE_URL}/${ASSET}.tgz"
          curl -sSfLO "${BASE_URL}/${ASSET}.tgz.sha256"
          echo "$(cat "${ASSET}.tgz.sha256")  ${ASSET}.tgz" | sha256sum -c -
          mkdir -p ~/.cargo/bin
          tar -xzf "${ASSET}.tgz" -C ~/.cargo/bin
          flutter_rust_bridge_codegen --version

      - name: Regenerate bindings
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flutter_rust_bridge_codegen generate
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Fail if bindings are stale
        run: |
          CHANGED=$(git status --porcelain -- lib/core/rust rust/telepathy-core/src/frb_generated.rs)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            git diff -- lib/core/rust rust/telepathy-core/src/frb_generated.rs | head -200
            echo "::error::Flutter Rust Bridge bindings are out of date. Run 'flutter_rust_bridge_codegen generate' and 'cargo fmt --manifest-path rust/Cargo.toml --all' locally and commit the result."
            exit 1
          fi

  test_flutter:
    needs: lint_flutter
    runs-on: ubuntu-latest
    name: Test Flutter
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.7

      - name: Get Packages
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test test

  test_rust:
    needs: lint_rust
    runs-on: ubuntu-latest
    name: Test Rust
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          cache: true
          cache-workspaces: rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none

      - name: Run Rust tests
        run: |
          cd rust
          cargo nextest run --all-targets -E 'not kind(=bench) and not binary(=core_integration_test)'
          cargo nextest run -p telepathy_core --test core_integration_test --features integration-testing --stress-count 10

  build_rust:
    needs: [lint_rust, test_rust]
    runs-on: ${{ matrix.info.image }}
    name: Build Rust [${{ matrix.info.image }} ${{ matrix.info.target }}]

    strategy:
      fail-fast: true

      matrix:
        info:
          - image: windows-2022
            target: x86_64-pc-windows-msvc
          - image: macos-14
            target: aarch64-apple-darwin
          - image: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - image: ubuntu-latest
            target: aarch64-linux-android
          - image: macos-15
            target: aarch64-apple-ios

    steps:
      - uses: actions/checkout@v7

      - name: Linux Prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Setup Android SDK
        if: matrix.info.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v4

      - uses: nttld/setup-ndk@v1
        if: matrix.info.target == 'aarch64-linux-android'
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Set up NDK
        if: matrix.info.target == 'aarch64-linux-android'
        run: |
          export TARGET_TRIPLE="aarch64-linux-android"
          export TARGET_API="26"
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TARGET_API/$TARGET_TRIPLE" >> $GITHUB_PATH

      - name: Configure Rust for Android
        if: matrix.info.target == 'aarch64-linux-android'
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" >> $GITHUB_ENV
          echo "RUSTFLAGS=-L $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/" >> $GITHUB_ENV

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          target: ${{ matrix.info.target }}
          cache: true
          cache-workspaces: rust

      - name: Configure Apple Rust build environment
        if: startsWith(matrix.info.target, 'aarch64-apple-')
        run: |
          if [[ "${{ matrix.info.target }}" == "aarch64-apple-darwin" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.info.target }}" == "aarch64-apple-ios" ]]; then
            IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
            IOS_CLANG="$(xcrun --sdk iphoneos --find clang)"
            IOS_AR="$(xcrun --sdk iphoneos --find ar)"

            echo "SDKROOT=$IOS_SDK" >> "$GITHUB_ENV"
            echo "IPHONEOS_DEPLOYMENT_TARGET=18.0" >> "$GITHUB_ENV"
            echo "CC_aarch64_apple_ios=$IOS_CLANG" >> "$GITHUB_ENV"
            echo "AR_aarch64_apple_ios=$IOS_AR" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$IOS_CLANG" >> "$GITHUB_ENV"
            echo "CFLAGS_aarch64_apple_ios=-target arm64-apple-ios -isysroot $IOS_SDK -miphoneos-version-min=18.0" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cd rust && cargo build --verbose --target ${{ matrix.info.target }}

  system_tests:
    needs: lint_rust
    uses: ./.github/workflows/system-tests.yml
    with:
      sweep_indices: '[0,1,2]'

  build_flutter:
    needs: [lint_rust, lint_flutter]
    uses: ./.github/workflows/build-flutter.yml
    with:
      skip-cache: false
