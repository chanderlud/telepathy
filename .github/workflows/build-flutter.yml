name: Build Flutter

on:
  workflow_call:
    inputs:
      skip-cache:
        description: "Disable artifact caching (useful for fresh release builds)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_flutter:
    runs-on: ${{ matrix.info.image }}
    name: Build Flutter [${{ matrix.info.image }} ${{ matrix.info.target }} ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}]

    strategy:
      fail-fast: false

      matrix:
        info:
          - image: windows-2022
            target: windows
          - image: macos-14
            target: macos
          - image: ubuntu-24.04
            target: linux
          - image: ubuntu-22.04
            target: linux
          - image: windows-2022
            target: apk
          - image: macos-15
            target: ios
          - image: ubuntu-24.04
            target: web

    steps:
      - uses: actions/checkout@v7

      - name: Cache Cargo registry
        if: ${{ !inputs.skip-cache }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: cargo-${{ matrix.info.image }}-${{ matrix.info.target }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.info.image }}-${{ matrix.info.target }}-
            cargo-${{ matrix.info.image }}-

      - name: Cache Flutter pub
        if: ${{ !inputs.skip-cache }}
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache cargo install binaries
        if: matrix.info.target == 'web' && !inputs.skip-cache
        id: cache-cargo-tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/wasm-pack
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/workflows/build-flutter.yml', 'web/build_web.sh') }}

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.7

      - name: Set up Java 17
        if: matrix.info.target == 'apk'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get Packages
        run: flutter pub get

      - name: Setup Rust for Apple Flutter builds
        if: matrix.info.target == 'macos' || matrix.info.target == 'ios'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'
          cache: true
          cache-workspaces: rust

      - name: Install Apple Rust targets
        if: matrix.info.target == 'macos' || matrix.info.target == 'ios'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add aarch64-apple-ios
          if [[ "${{ matrix.info.target }}" == "macos" && "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            rustup target add x86_64-apple-darwin
          fi

      - name: Linux Prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libsecret-1-dev

      - name: Linux Release Prerequisites
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get install rpm patchelf gcc-aarch64-linux-gnu g++-aarch64-linux-gnu dpkg-cross && dart pub global activate flutter_distributor

      - name: Install Web Tools
        if: matrix.info.target == 'web' && steps.cache-cargo-tools.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen@2.12.0 wasm-pack

      - name: Setup Rust nightly for Web
        if: matrix.info.target == 'web'
        run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Build Web
        if: matrix.info.target == 'web'
        run: ./web/build_web.sh

      - name: Build macOS unsigned
        if: matrix.info.target == 'macos'
        run: |
          set -eux
          MODE="${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}"
          CONFIG="${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Debug' }}"
          BUILD_DIR="$PWD/build/macos"
          XCODE_ARGS=(-destination platform=macOS)
          if [[ "$MODE" == "release" ]]; then
            XCODE_ARGS+=(ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO)
          fi
          flutter build macos --config-only --$MODE
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration "$CONFIG" \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MACOSX_DEPLOYMENT_TARGET=10.15 \
            "${XCODE_ARGS[@]}" \
            OBJROOT="$BUILD_DIR/Build/Intermediates.noindex" \
            SYMROOT="$BUILD_DIR/Build/Products" \
            build

      - name: Build iOS unsigned
        if: matrix.info.target == 'ios'
        run: flutter build ios ${{ startsWith(github.ref, 'refs/tags/') && '--release' || '--debug' }} --no-codesign

      - name: Build Flutter
        if: matrix.info.target != 'macos' && matrix.info.target != 'ios' && (matrix.info.target != 'linux' || !startsWith(github.ref, 'refs/tags/'))
        run: flutter build ${{ matrix.info.target }} ${{ startsWith(github.ref, 'refs/tags/') && '--release' || '--debug' }} ${{ matrix.info.target == 'web' && startsWith(github.ref, 'refs/tags/') && '--base-href /' || '' }}

      - name: Package deb & rpm
        if: matrix.info.target == 'linux' && startsWith(github.ref, 'refs/tags/')
        run: |
          flutter_distributor release --name=distribution --jobs=release-distribution-linux-deb,release-distribution-linux-rpm
          mv dist/*/telepathy-*-linux.deb telepathy.deb
          mv dist/*/telepathy-*-linux.rpm telepathy.rpm

      - name: Compile Windows Installer
        if: matrix.info.target == 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: deep-soft/Inno-Setup-Action@v1.2.2
        with:
          path: windows/installer.iss

      - name: Move Windows Installer
        if: matrix.info.target == 'windows' && startsWith(github.ref, 'refs/tags/')
        run: mv windows/Output/telepathy_installer.exe telepathy-windows-x64.exe

      - name: Move APK
        if: matrix.info.target == 'apk'
        run: mv build/app/outputs/flutter-apk/${{ startsWith(github.ref, 'refs/tags/') && 'app-release.apk' || 'app-debug.apk' }} telepathy.apk

      - name: Move macOS Bundle
        if: matrix.info.target == 'macos'
        run: mv build/macos/Build/Products/${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Debug' }}/Telepathy.app telepathy-macos.app

      - name: Package macOS universal unsigned DMG
        if: matrix.info.target == 'macos' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -eux
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' telepathy-macos.app/Contents/Info.plist)"
          lipo -verify_arch arm64 x86_64 "telepathy-macos.app/Contents/MacOS/$EXECUTABLE_NAME"
          hdiutil create -volname Telepathy -srcfolder telepathy-macos.app -ov -format UDZO telepathy-macos-universal-unsigned.dmg
          hdiutil verify telepathy-macos-universal-unsigned.dmg

      - name: Move iOS Bundle
        if: matrix.info.target == 'ios'
        run: mv build/ios/iphoneos/Runner.app telepathy-ios.app

      - name: Package iOS Bundle
        if: matrix.info.target == 'ios'
        run: ditto -c -k --keepParent telepathy-ios.app telepathy-ios-unsigned-app.zip

      - name: Move Linux Bundle
        if: matrix.info.target == 'linux'
        run: mv build/linux/x64/${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}/bundle telepathy

      - name: Move Windows Bundle
        if: matrix.info.target == 'windows'
        run: mv build/windows/x64/runner/${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Debug' }} telepathy

      - name: Move Web Bundle
        if: matrix.info.target == 'web'
        run: mv build/web telepathy

      - name: Upload macOS Artifact
        if: matrix.info.target == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: telepathy_${{ matrix.info.image }}_${{ matrix.info.target }}
          path: ${{ startsWith(github.ref, 'refs/tags/') && 'telepathy-macos-universal-unsigned.dmg' || 'telepathy-macos.app' }}

      - name: Upload Artifacts
        if: matrix.info.target != 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: telepathy_${{ matrix.info.image }}_${{ matrix.info.target }}
          path: |
            telepathy.apk
            telepathy
            telepathy-ios-unsigned-app.zip
            telepathy-windows-x64.exe
            telepathy.deb
            telepathy.rpm
          if-no-files-found: ignore
