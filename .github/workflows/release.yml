name: Release

# Fires when the CI workflow completes, then downloads CI's build_flutter
# artifacts instead of rebuilding them. The per-job `is_tag_release` gate
# ensures we only run when CI was triggered by a `v*` tag push.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Release runs are queued, not cancelled, to avoid orphaned assets mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: skip release when the triggering CI run did not succeed or was not
  # triggered by a `v*` tag push.
  checks_passed:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    name: CI status gate
    steps:
      - run: echo "CI run ${{ github.event.workflow_run.id }} on ${{ github.event.workflow_run.head_branch }} succeeded; proceeding with release."

  build_cross:
    needs: checks_passed
    runs-on: ubuntu-22.04
    name: Build on ${{ matrix.distro }} ${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - arch: aarch64
            distro: ubuntu20.04
            out: arm64
          - arch: aarch64
            distro: ubuntu22.04
            out: arm64
          - arch: aarch64
            distro: ubuntu24.04
            out: arm64
          # - arch: riscv64
          #   distro: ubuntu22.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Cache Cargo registry for cross build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo-cache/registry/index
            ~/.cargo-cache/registry/cache
            ~/.cargo-cache/git/db
          key: cargo-cross-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: cargo-cross-${{ matrix.distro }}-${{ matrix.arch }}-

      - name: Build artifact
        uses: uraimo/run-on-arch-action@v3
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          githubToken: ${{ secrets.GHCR_PAT }}
          shell: /bin/bash

          setup: |
            mkdir -p "${PWD}/artifacts"
            mkdir -p "$HOME/.cargo-cache/registry"
            mkdir -p "$HOME/.cargo-cache/git"

          dockerRunArgs: |
            --volume "${PWD}/artifacts:/artifacts"
            --volume "$HOME/.cargo-cache/registry:/root/.cargo/registry"
            --volume "$HOME/.cargo-cache/git:/root/.cargo/git"

          install: |
            case "${{ matrix.distro }}" in
              ubuntu*)
                apt-get update -q -y
                apt-get install -q -y protobuf-compiler clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev ${{ matrix.distro == 'ubuntu20.04' && 'libstdc++-10-dev' || 'libstdc++-12-dev' }} libasound2-dev libsecret-1-dev rpm patchelf dpkg-cross curl unzip
                case "${{ matrix.distro }}" in
                  ubuntu20.04)
                    apt-get install -q -y lld-10
                    ;;
                  ubuntu22.04)
                    apt-get install -q -y lld-14
                    ;;
                  ubuntu24.04)
                    apt-get install -q -y lld-18
                    ;;
                esac

                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /flutter

                case "${{ matrix.arch }}" in
                  aarch64)
                    apt-get install -q -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
                    ;;
                  riscv64)
                    apt-get install -q -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu

                    export CMAKE_SYSTEM_PROCESSOR=riscv64
                    export TARGET_ARCH=riscv64
                    export DART_TARGET_ARCH=riscv64

                    curl -o dart-sdk.zip https://storage.googleapis.com/dart-archive/channels/stable/release/3.9.2/sdk/dartsdk-linux-riscv64-release.zip
                    unzip dart-sdk.zip
                    mkdir /flutter/bin/cache
                    mv dart-sdk /flutter/bin/cache/dart-sdk
                    touch /flutter/bin/cache/.dart-sdk.stamp
                    export PATH=/flutter/bin/cache/dart-sdk/bin:$PATH
                    ;;
                esac

                /flutter/bin/flutter --version
                /flutter/bin/cache/dart-sdk/bin/dart pub global activate flutter_distributor
                ;;
            esac

          run: |
            export PATH="$PATH:$HOME/.cargo/bin"
            export PATH="$PATH:/flutter/bin"
            export PATH="$PATH":"$HOME/.pub-cache/bin"
            export PATH=/flutter/bin/cache/dart-sdk/bin:$PATH

            if [[ "${{ matrix.distro }}" == "ubuntu20.04" ]]; then
              export CC=clang
              export CXX=clang++
              export CC_aarch64_unknown_linux_gnu=clang
              export CXX_aarch64_unknown_linux_gnu=clang++
            fi

            echo "CC=${CC:-unset}"
            ${CC:-cc} --version | head -n 1

            flutter_distributor release --name=distribution --jobs=release-distribution-linux-deb,release-distribution-linux-rpm
            mv dist/*/telepathy-*-linux.deb /artifacts/telepathy.deb
            mv dist/*/telepathy-*-linux.rpm /artifacts/telepathy.rpm
            mv build/linux/${{ matrix.out }}/release/bundle /artifacts/telepathy

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: telepathy_${{ matrix.distro }}_${{ matrix.arch }}
          path: artifacts

  publish_release:
    name: Prepare & upload release assets
    needs:
      - checks_passed
      - build_cross
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Mint the OIDC token Sigstore signs, and publish the attestation.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download all artifacts from CI run
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version from tag
        id: version
        run: |
          ref="${{ github.event.workflow_run.head_branch }}"
          ref="${ref##*/}"
          ver="${ref#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Rename and package files
        run: |
          set -eux
          VER=${{ steps.version.outputs.version }}

          ls -R artifacts

          #
          # ANDROID
          #
          mv "artifacts/telepathy_windows-2022_apk/telepathy.apk" \
             "dist/telepathy-${VER}-android.apk"

          #
          # WINDOWS (installer + portable zip)
          #
          mv "artifacts/telepathy_windows-2022_windows/telepathy-windows-x64.exe" \
             "dist/telepathy-${VER}-windows-installer-x86_64.exe"

          cd artifacts/telepathy_windows-2022_windows
          zip -r "../../dist/telepathy-${VER}-windows-standalone-x86_64.zip" telepathy
          cd ../../

          mv "artifacts/telepathy_macos-14_macos/telepathy-macos-unsigned.zip" \
             "dist/telepathy-${VER}-macos-arm64-unsigned.zip"

          mv "artifacts/telepathy_macos-15_ios/telepathy-ios-unsigned-app.zip" \
             "dist/telepathy-${VER}-ios-arm64-unsigned-app.zip"

          #
          # LINUX x86_64 (built on ubuntu-24.04 -> noble)
          #
          mv "artifacts/telepathy_ubuntu-24.04_linux/telepathy.deb" \
             "dist/telepathy-${VER}-noble-x86_64.deb"

          mv "artifacts/telepathy_ubuntu-24.04_linux/telepathy.rpm" \
             "dist/telepathy-${VER}-noble-x86_64.rpm"

          cd artifacts/telepathy_ubuntu-24.04_linux
          zip -r "../../dist/telepathy-${VER}-noble-x86_64.zip" telepathy
          cd ../../

          #
          # LINUX x86_64 (built on ubuntu-22.04 -> jammy)
          #
          mv "artifacts/telepathy_ubuntu-22.04_linux/telepathy.deb" \
             "dist/telepathy-${VER}-jammy-x86_64.deb"

          mv "artifacts/telepathy_ubuntu-22.04_linux/telepathy.rpm" \
             "dist/telepathy-${VER}-jammy-x86_64.rpm"

          cd artifacts/telepathy_ubuntu-22.04_linux
          zip -r "../../dist/telepathy-${VER}-jammy-x86_64.zip" telepathy
          cd ../../

          #
          # LINUX aarch64 (built on ubuntu-20.04 -> focal)
          #
          mv "artifacts/telepathy_ubuntu20.04_aarch64/telepathy.deb" \
             "dist/telepathy-${VER}-focal-aarch64.deb"

          mv "artifacts/telepathy_ubuntu20.04_aarch64/telepathy.rpm" \
             "dist/telepathy-${VER}-focal-aarch64.rpm"

          cd artifacts/telepathy_ubuntu20.04_aarch64
          zip -r "../../dist/telepathy-${VER}-focal-aarch64.zip" telepathy
          cd ../../

          #
          # LINUX aarch64 (built on ubuntu-22.04 -> jammy)
          #
          mv "artifacts/telepathy_ubuntu22.04_aarch64/telepathy.deb" \
             "dist/telepathy-${VER}-jammy-aarch64.deb"

          mv "artifacts/telepathy_ubuntu22.04_aarch64/telepathy.rpm" \
             "dist/telepathy-${VER}-jammy-aarch64.rpm"

          cd artifacts/telepathy_ubuntu22.04_aarch64
          zip -r "../../dist/telepathy-${VER}-jammy-aarch64.zip" telepathy
          cd ../../

          #
          # LINUX aarch64 (built on ubuntu-24.04 -> noble)
          #
          mv "artifacts/telepathy_ubuntu24.04_aarch64/telepathy.deb" \
             "dist/telepathy-${VER}-noble-aarch64.deb"

          mv "artifacts/telepathy_ubuntu24.04_aarch64/telepathy.rpm" \
             "dist/telepathy-${VER}-noble-aarch64.rpm"

          cd artifacts/telepathy_ubuntu24.04_aarch64
          zip -r "../../dist/telepathy-${VER}-noble-aarch64.zip" telepathy
          cd ../../

          #
          # WEB bundle
          #
          cd artifacts/telepathy_ubuntu-24.04_web
          zip -r "../../dist/telepathy-${VER}-web.zip" telepathy
          cd ../../

          echo "Final files:"
          ls -lh dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_web:
    name: Deploy web to Cloudflare Pages
    needs:
      - checks_passed
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download web artifact from CI run
        uses: actions/download-artifact@v8
        with:
          name: telepathy_ubuntu-24.04_web
          path: web-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-artifact/telepathy --project-name=telepathy --branch=main
